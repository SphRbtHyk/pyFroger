[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyfroger"
version = "0.0.1"
dependencies = []
requires-python = ">=3.8"
authors = [
  {name = "Sophie Robert-Hayek",email = "sophie.robert@sorbonne-universite.fr"},
]
maintainers = [
  {name = "Sophie Robert-Hayek",email = "sophie.robert@sorbonne-universite.fr"}
]
description = "Implements Dom Froger algorithms for building a stemma."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.5"
]

[tool.hatch.build.targets.wheel]
packages = ["src/pyfroger"]